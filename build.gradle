plugins {
  id "com.github.johnrengelman.shadow" version "8.1.1"
}

apply plugin: 'java-library'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'com.github.johnrengelman.shadow'

repositories {
  mavenCentral()
  maven { url "https://jitpack.io" }
}

group = prjGroup
version = prjVer
sourceCompatibility = prjCompat
targetCompatibility = prjCompat

dependencies {
  implementation 'com.zaxxer:HikariCP:5.0.1'
  implementation 'org.mariadb.jdbc:mariadb-java-client:3.1.4'
  implementation 'org.slf4j:slf4j-api:2.0.9'
  testImplementation 'org.easymock:easymock:4.3'
  testImplementation 'org.testng:testng:7.4.0'
}

eclipse {
  classpath {
    downloadJavadoc = true
    downloadSources = true
  }
}

test {
  useTestNG() {
    suites 'src/test/resources/testng.xml'
  }
}

artifacts {
  archives shadowJar
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
    }
  }

  // The forge is where artifacts go now. maven-publish stays -- it is what
  // produces the POM, so a consumer gets this project's own dependencies
  // transitively instead of a bare jar.
  //
  // CREDENTIALS COME FROM THE ENVIRONMENT AND ARE ABSENT LOCALLY ON PURPOSE:
  // `gradle build` never touches this block, so a clone with no credential
  // builds and tests exactly as CI does. Only `gradle publish` needs them, and
  // in CI they are the axonibyte org secrets PACKAGE_USER / PACKAGE_TOKEN -- a
  // real token, because the job's own token is answered 401 reqPackageAccess
  // by the package registry (measured, run 344).
  repositories {
    maven {
      name = "forge"
      url = "https://forge.axonibyte.com/api/packages/axonibyte/maven"
      credentials {
        username = System.getenv("PACKAGE_USER") ?: ""
        password = System.getenv("PACKAGE_TOKEN") ?: ""
      }
    }
  }
}
